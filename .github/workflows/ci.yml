# Runs the same checks `make check` runs locally, plus the demo smoke
# job which mirrors the README quickstart. Static gates stay in one
# place (lint job) so failures point at the right problem.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" ./cmd/promptmap

  # End to end proof: scan the demo server in both modes and assert
  # the exit codes (2 means hits found, 0 means clean).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o promptmap ./cmd/promptmap
      - run: go build -o demoserver ./tools/demoserver
      - run: ./promptmap init --output smoke.yaml
      - name: scan vulnerable demo (expect hits)
        run: |
          # Actions runs steps with errexit, and the scan exits 2 on hits
          # by design, so without set +e the shell would die before the
          # assertion runs. Capture the code, always stop the server,
          # and let the final test decide the step.
          set +e
          ./demoserver --mode vulnerable &
          echo $! > demo.pid
          sleep 2
          ./promptmap scan --config smoke.yaml --i-have-permission --max-probes 12 -o smoke-vuln.json
          scan_code=$?
          kill $(cat demo.pid)
          test $scan_code -eq 2
      - name: scan safe demo (expect clean)
        run: |
          set +e
          ./demoserver --mode safe &
          echo $! > demo.pid
          sleep 2
          ./promptmap scan --config smoke.yaml --i-have-permission --max-probes 12 -o smoke-safe.json
          scan_code=$?
          kill $(cat demo.pid)
          test $scan_code -eq 0
